name: Deploy to GitHub Pages

on:
  # Disabled by default — nsite is the default deploy target (see deploy-nsite.yml).
  # Re-enable automatic Pages deploys by setting the DEPLOY_GH_PAGES repository
  # variable to "true" (Settings → Secrets and variables → Actions → Variables),
  # or run the workflow manually from the Actions tab.
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_GH_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm install
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site (build_type: workflow) if the repo doesn't have
          # one yet — without this, configure-pages fails with "Get Pages site
          # failed: Not Found" on repos where Pages was never enabled.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
